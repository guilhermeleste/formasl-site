<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Forma — Language / Idioma / 语言</title><style>
:root{color-scheme:light}body{margin:0;background:#efe8dd;color:#192122;font-family:Arial,system-ui,sans-serif;display:grid;place-items:center;min-height:100svh}.gate{max-width:600px;padding:40px}h1{font-size:clamp(64px,13vw,110px);letter-spacing:-.08em;margin:0 0 15px}p{font-size:18px;line-height:1.6}nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:35px}a{border:1px solid #87918d;padding:14px 18px;color:#192122;text-decoration:none}a:hover,a:focus{background:#192122;color:#efe8dd}</style>
<script>(function(){'use strict';var ok=['pt','en','zh-CN'];function valid(s){return ok.indexOf(s)>=0;}function detect(){var prefs=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'];for(var i=0;i<prefs.length;i++){var l=String(prefs[i]).toLowerCase();if(l==='pt'||l.indexOf('pt-')===0)return'pt';if(l==='en'||l.indexOf('en-')===0)return'en';if(l==='zh'||l.indexOf('zh-')===0)return'zh-CN';}return'en';}var u=new URL(location.href);var query=u.searchParams.get('lang');var saved=null;try{saved=localStorage.getItem('forma-site-language');}catch(_){ }var chosen=valid(query)?query:valid(saved)?saved:detect();if(valid(query))try{localStorage.setItem('forma-site-language',chosen);}catch(_){};var next=new URL(chosen+'/index.html',u);if(location.hash)next.hash=location.hash;location.replace(next.href);})();</script></head><body><main class="gate"><h1>FORMA.</h1><p>Escolha o idioma · Choose a language · 选择语言</p><nav aria-label="Language selection"><a href="pt/index.html" data-choose="pt">Português</a><a href="en/index.html" data-choose="en">English</a><a href="zh-CN/index.html" data-choose="zh-CN">简体中文</a></nav></main>
<script>document.querySelectorAll('[data-choose]').forEach(function(a){a.addEventListener('click',function(){try{localStorage.setItem('forma-site-language',a.dataset.choose);}catch(_){}});});</script></body></html>
